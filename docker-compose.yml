version: '3.8'

services:
  pizzaapi:
    build:
      context: .
      dockerfile: PizzaAPI/Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__DefaultConnection=Server=mysql;Database=PizzaDB;User=pizzauser;Password=pizzapass;
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      timeout: 30s
      retries: 5
      interval: 30s
      start_period: 60s
    networks:
      - pizza-network

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: PizzaDB
      MYSQL_USER: pizzauser
      MYSQL_PASSWORD: pizzapass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s
    networks:
      - pizza-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "8082:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: pizzauser
      PMA_PASSWORD: pizzapass
    depends_on:
      - mysql
    networks:
      - pizza-network

volumes:
  mysql_data:

networks:
  pizza-network:
    driver: bridge